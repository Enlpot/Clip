[package]
name = "clip-diagnostics-test"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib"]
# The extern "C" clip_diag_* symbols this fixture forwards to are resolved by
# the C++ crash-bridge at final link; the standalone lib test target cannot
# link them and the crate ships no Rust tests.
test = false
doctest = false

[features]
default = ["crash-diagnostics"]
crash-diagnostics = []

[dependencies]
clip-core = { path = "../clip-core" }
clip-diagnostics = { path = "../clip-diagnostics" }
