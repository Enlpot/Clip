name: Clip WinGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published Clip release tag (including v and optional _clip-shot)
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: windows-2025
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      eligible: ${{ steps.release.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test manifest and submission behavior
        shell: pwsh
        run: |
          ./scripts/test-clip-shot-winget.ps1
          ./scripts/test-clip-shot-mini-release.ps1
          ./scripts/test-clip-shot-arm64-distribution.ps1
      - name: Resolve Clip tag
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          . ./scripts/clip-shot-winget.ps1
          try { $version = Get-ClipShotWingetVersion $env:RELEASE_TAG }
          catch {
            if ($env:EVENT_NAME -eq 'workflow_dispatch') { throw }
            'eligible=false' >> $env:GITHUB_OUTPUT
            Write-Output 'Ignoring an unrelated release tag.'
            exit 0
          }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          'eligible=true' >> $env:GITHUB_OUTPUT

  submit:
    needs: [resolve, install]
    if: needs.resolve.outputs.eligible == 'true'
    runs-on: windows-2025
    concurrency:
      group: winget-mg-chao.clip-shot-${{ needs.resolve.outputs.version }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Generate both edition manifests from the published release
        id: manifests
        shell: pwsh
        run: |
          . ./scripts/clip-shot-winget.ps1
          $version = Get-ClipShotWingetVersion $env:RELEASE_TAG
          $release = Invoke-ClipShotWingetApi "repos/mg-chao/clip-apps/releases/tags/$env:RELEASE_TAG"
          $plan = @(foreach ($edition in @(Get-ClipShotReleaseEditions $release $version)) {
            $directory = ./scripts/new-clip-shot-winget-manifest.ps1 -Tag $env:RELEASE_TAG -Edition $edition
            @{ edition = $edition; directory = $directory }
          })
          $plan | ConvertTo-Json -AsArray | Set-Content build/winget/submissions.json -Encoding utf8NoBOM
      - name: Preserve manifests for review and manual submission
        uses: actions/upload-artifact@v4
        with:
          name: winget-mg-chao.clip-shot-${{ needs.resolve.outputs.version }}
          path: build/winget/manifests
          if-no-files-found: error
      - name: Prepare WinGet validation
        shell: pwsh
        run: |
          $path = ./scripts/initialize-clip-shot-winget.ps1
          "WINGET_EXE=$path" >> $env:GITHUB_ENV
      - name: Validate manifests
        shell: pwsh
        run: |
          foreach ($item in @(Get-Content build/winget/submissions.json -Raw | ConvertFrom-Json)) {
            & $env:WINGET_EXE validate --manifest $item.directory --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest validation failed.' }
          }
      - name: Download pinned WinGetCreate
        shell: pwsh
        run: |
          $url = 'https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe'
          Invoke-WebRequest -Uri $url -OutFile build/winget/wingetcreate.exe
          $expected = '24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA'
          if ((Get-FileHash build/winget/wingetcreate.exe -Algorithm SHA256).Hash -cne $expected) {
            throw 'WinGetCreate SHA-256 mismatch.'
          }
      - name: Submit unless already merged or pending
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          foreach ($item in @(Get-Content build/winget/submissions.json -Raw | ConvertFrom-Json)) {
            ./scripts/submit-clip-shot-winget.ps1 -Tag $env:RELEASE_TAG -Edition $item.edition `
              -ManifestDirectory $item.directory -WingetCreate ./build/winget/wingetcreate.exe
          }

  install:
    needs: resolve
    if: needs.resolve.outputs.eligible == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025-vs2026
          - architecture: arm64
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve matching native release
        id: native
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          . ./scripts/clip-shot-winget.ps1
          $release = Invoke-ClipShotWingetApi "repos/mg-chao/clip-apps/releases/tags/$env:RELEASE_TAG"
          $architectures = @(Get-ClipShotReleaseArchitectures $release '${{ needs.resolve.outputs.version }}')
          "available=$('${{ matrix.architecture }}' -in $architectures)" >> $env:GITHUB_OUTPUT
      - name: Provision native WinGet
        if: steps.native.outputs.available == 'True'
        shell: pwsh
        run: |
          $path = ./scripts/initialize-clip-shot-winget.ps1
          "WINGET_EXE=$path" >> $env:GITHUB_ENV
      - name: Verify native install, uninstall, reinstall and data retention
        if: steps.native.outputs.available == 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          . ./scripts/clip-shot-winget.ps1
          $release = Invoke-ClipShotWingetApi "repos/mg-chao/clip-apps/releases/tags/$env:RELEASE_TAG"
          foreach ($edition in @(Get-ClipShotReleaseEditions $release '${{ needs.resolve.outputs.version }}')) {
            $previous = $null
            foreach ($candidate in @(Invoke-ClipShotWingetApi 'repos/mg-chao/clip-apps/releases?per_page=100')) {
              if ($candidate.draft -or $candidate.tag_name -ceq $env:RELEASE_TAG) { continue }
              try {
                $version = Get-ClipShotWingetVersion $candidate.tag_name
                if ([Management.Automation.SemanticVersion]::Parse($version) -ge
                    [Management.Automation.SemanticVersion]::Parse('${{ needs.resolve.outputs.version }}')) { continue }
                if ('${{ matrix.architecture }}' -in @(Get-ClipShotReleaseArchitectures $candidate $version) -and
                    $edition -in @(Get-ClipShotReleaseEditions $candidate $version)) { $previous = $candidate; break }
              } catch { continue }
            }
            $upgrade = if ($previous) { @{ PreviousTag = $previous.tag_name; RunningAppBehavior = 'Restart' } } else { @{ SkipUpgrade = $true } }
            ./scripts/test-clip-shot-winget-install.ps1 -Tag $env:RELEASE_TAG -Edition $edition `
              -Architecture ${{ matrix.architecture }} -Winget $env:WINGET_EXE -AllowUnrecognizedRelease @upgrade
          }
      - name: Preserve native lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-shot-winget-lifecycle-${{ matrix.architecture }}
          path: build/winget-install-test
          if-no-files-found: ignore
