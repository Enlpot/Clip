name: Clip Static Release

on:
  push:
    tags:
      - "v*_clip-shot"

permissions:
  contents: write

concurrency:
  group: clip-shot-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build native Windows ${{ matrix.architecture }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: clip-win-x64
            preset: clip-shot-msvc-release
            rust-target: x86_64-pc-windows-msvc
            qt-kit: msvc2026_64-static-system-codecs
            installed-root: .tools/vcpkg/installed/static
    runs-on: ${{ matrix.runner }}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.tools\vcpkg-binary-cache,readwrite
      CLIP_ARCHITECTURE: ${{ matrix.architecture }}
      CLIP_PRESET: ${{ matrix.preset }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Reuse local vcpkg and Qt tool tree
        shell: pwsh
        run: |
          function New-ReuseJunction {
            param([string]$Dst, [string]$Src)
            if (Test-Path -LiteralPath $Dst) {
              Remove-Item -LiteralPath $Dst -Recurse -Force
            }
            New-Item -ItemType Directory -Path (Split-Path $Dst -Parent) -Force | Out-Null
            New-Item -ItemType Junction -Path $Dst -Target $Src -Force | Out-Null
          }
          $local = if ($env:CLIP_LOCAL_TOOLS) { $env:CLIP_LOCAL_TOOLS } else { 'D:\WinDevelop\Clip\.tools' }
          if (Test-Path -LiteralPath (Join-Path $local 'vcpkg\vcpkg.exe')) {
            New-ReuseJunction -Dst (Join-Path $env:GITHUB_WORKSPACE '.tools') -Src $local
            Write-Output "Reused local tool tree: $local"
          } else {
            Write-Output 'No reusable local tool tree; full bootstrap will run.'
          }
          $repoParent = Split-Path $local -Parent
          foreach ($modelDir in @('artifacts\qr-models-wechat', 'artifacts\ocr-models-ppocrv6-small-463ea9f')) {
            $src = Join-Path $repoParent $modelDir
            if (Test-Path -LiteralPath $src) {
              New-ReuseJunction -Dst (Join-Path $env:GITHUB_WORKSPACE $modelDir) -Src $src
              Write-Output "Reused local models: $src"
            }
          }

      - name: Ensure build tools on PATH
        shell: pwsh
        run: |
          $additions = @()
          foreach ($candidate in @('C:\Program Files\Git\bin', 'C:\Program Files\Git\usr\bin', 'C:\Program Files\Git\cmd')) {
            if ((Test-Path -LiteralPath (Join-Path $candidate 'bash.exe')) -or (Test-Path -LiteralPath (Join-Path $candidate 'git.exe'))) {
              $additions += $candidate
            }
          }
          foreach ($ninjaRoot in @('C:\Users\bendi\AppData\Local\Programs\Ninja')) {
            if (Test-Path -LiteralPath (Join-Path $ninjaRoot 'ninja.exe')) {
              $additions += $ninjaRoot
            }
          }
          $rustToolchainBin = 'C:\Users\bendi\.rustup\toolchains\1.97.1-x86_64-pc-windows-msvc\bin'
          if (Test-Path -LiteralPath (Join-Path $rustToolchainBin 'cargo.exe')) {
            $additions += $rustToolchainBin
          }
          if ($additions.Count -gt 0) {
            "PATH=$($additions -join ';');$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          Write-Output "PATH additions: $($additions -join ';')"

      - name: Install Python build helper
        shell: pwsh
        run: python -m pip install --disable-pip-version-check virtualenv

      - name: Export GitHub Actions cache service
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            clip-crates -> ../build/${{ matrix.preset }}/cargo
            clip_draw_engine_qt -> ../build/${{ matrix.preset }}/cargo
            clip_rust_ffi -> ../build/${{ matrix.preset }}/cargo
          cache-on-failure: true
          add-job-id-key: false

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.tools\vcpkg-binary-cache
          key: vcpkg-static-${{ matrix.architecture }}-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/*-windows-static.cmake') }}

      - name: Install static project dependencies
        shell: pwsh
        run: .\scripts\bootstrap.ps1 -Architecture $env:CLIP_ARCHITECTURE -VcpkgVariants Static -SkipQtValidation -SkipRustupInstall

      - name: Resolve repository Qt toolchain
        id: qt-toolchain
        shell: pwsh
        run: |
          . scripts/clip-build-environment.ps1
          "version=$script:ClipQtVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache static Qt kit
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}\clip-qt\${{ steps.qt-toolchain.outputs.version }}\${{ matrix.qt-kit }}
          key: clip-qt-static-system-codecs-v6-development-${{ steps.qt-toolchain.outputs.version }}-msvc2026-${{ matrix.architecture }}-${{ runner.os }}-${{ hashFiles('scripts/qt-toolchain.json', 'scripts/build-static-qt.ps1', 'scripts/clip-build-environment.ps1', 'scripts/static-qt-features.json', 'scripts/qtbase-timezone-without-cldr.patch', 'scripts/bootstrap.ps1', 'vcpkg.json', 'cmake/vcpkg-overlay-triplets/*-windows-static.cmake', 'cmake/vcpkg-overlay-ports/zlib/**') }}

      - name: Prepare Qt LTS static kit
        shell: pwsh
        run: |
          . scripts/clip-build-environment.ps1
          $localQt = Join-Path $env:GITHUB_WORKSPACE ".tools\qt\$script:ClipQtVersion\static-$env:CLIP_ARCHITECTURE"
          $localConfig = Join-Path $localQt "lib\cmake\Qt6\Qt6Config.cmake"
          if (Test-Path -LiteralPath $localConfig -PathType Leaf) {
            $qtDir = Join-Path $localQt "lib\cmake\Qt6"
            "CLIP_QT_STATIC_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "Qt6_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Output "Reused local static Qt: $qtDir"
          } else {
            $prefix = Join-Path $env:RUNNER_TOOL_CACHE "clip-qt\$script:ClipQtVersion\${{ matrix.qt-kit }}"
            $dependencies = Join-Path $env:GITHUB_WORKSPACE "${{ matrix.installed-root }}/$env:CLIP_ARCHITECTURE-windows-static"
            & "$env:GITHUB_WORKSPACE\scripts\build-static-qt.ps1" -Architecture $env:CLIP_ARCHITECTURE -InstallPrefix $prefix -DependencyPrefix $dependencies -DevelopmentModules
            if ($LASTEXITCODE -ne 0) { throw "Static Qt bootstrap failed." }
            $qtDir = Join-Path $prefix "lib\cmake\Qt6"
            if (-not (Test-Path -LiteralPath (Join-Path $qtDir "Qt6Config.cmake") -PathType Leaf)) {
              throw "Qt $script:ClipQtVersion static CMake package was not found at $qtDir"
            }
            "CLIP_QT_STATIC_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "Qt6_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Verify native Qt timezone behavior
        shell: pwsh
        run: |
          . scripts/clip-build-environment.ps1
          Add-ClipMsvcToolsToPath -Architecture $env:CLIP_ARCHITECTURE | Out-Null
          cmake -S test-support/qt-timezone -B build/qt-timezone-size -G Ninja -DCMAKE_BUILD_TYPE=Release "-DQt6_DIR=$env:Qt6_DIR" "-DCMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE/${{ matrix.installed-root }}/$env:CLIP_ARCHITECTURE-windows-static"
          if ($LASTEXITCODE -ne 0) { throw "Qt timezone test configuration failed." }
          cmake --build build/qt-timezone-size --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Qt timezone test build failed." }
          ctest --test-dir build/qt-timezone-size -R '^clip-qt-timezone-tests$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Qt timezone behavior tests failed." }

      - name: Provision NSIS installer toolchain
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/NSIS/makensis.exe") -and
              -not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS provisioning failed.' }
          }

      - name: Build, audit, and package statically
        shell: pwsh
        run: .\scripts\stage-clip-shot-release.ps1 -Architecture $env:CLIP_ARCHITECTURE

      - name: Verify focused updater and installer behavior
        shell: pwsh
        run: |
          . scripts/clip-build-environment.ps1
          $null = Set-ClipBuildEnvironment -Preset $env:CLIP_PRESET
          python scripts/test-release-optimization.py
          if ($LASTEXITCODE -ne 0) { throw "Release optimization policy tests failed." }
          python scripts/test-release-optimization-pch.py --architecture x64 --toolset "version=14.51"
          if ($LASTEXITCODE -ne 0) { throw "Mixed optimization precompiled-header tests failed." }
          python scripts/test-clip-shot-mini-package.py
          if ($LASTEXITCODE -ne 0) { throw "Full/Mini compression configuration tests failed." }
          python -m unittest discover -s ant_design_qt/tools/tests -p test_generate_icon_pack.py
          if ($LASTEXITCODE -ne 0) { throw "Icon pack generator tests failed." }
          & scripts/test-static-qt-features.ps1
          python scripts/test-qt-cmake-contract.py
          if ($LASTEXITCODE -ne 0) { throw "Qt toolchain CMake contract tests failed." }
          python scripts/test-qt-translation-release.py
          if ($LASTEXITCODE -ne 0) { throw "Qt stock-dialog translation tests failed." }
          & scripts/test-performance-qt-environment.ps1
          & scripts/test-qt-shader-contract.ps1
          & scripts/test-clip-shot-package-compression.ps1
          python scripts/test-clip-shot-gitee-release.py
          if ($LASTEXITCODE -ne 0) { throw "Gitee mirror tests failed." }
          & scripts/test-clip-shot-github-release.ps1
          cargo test --manifest-path clip_shot/rust/clip-shot-updater/Cargo.toml --lib service::tests
          if ($LASTEXITCODE -ne 0) { throw "Updater fallback tests failed." }
          cargo test --manifest-path clip_shot/rust/clip-shot-updater/Cargo.toml --lib github::tests
          if ($LASTEXITCODE -ne 0) { throw "GitHub transport tests failed." }
          cargo test --manifest-path clip_shot/rust/clip-shot-updater/Cargo.toml --lib gitee::tests
          if ($LASTEXITCODE -ne 0) { throw "Gitee transport tests failed." }
          cargo test --manifest-path clip_shot/rust/clip-shot-updater/Cargo.toml --test service_protocol
          if ($LASTEXITCODE -ne 0) { throw 'Updater architecture and service protocol tests failed.' }
          cargo test --manifest-path clip_shot/rust/clip-shot-updater/Cargo.toml --test uninstall
          if ($LASTEXITCODE -ne 0) { throw 'Updater uninstall and installer bootstrap tests failed.' }
          cargo test --manifest-path clip_shot/rust/clip-shot-updater/Cargo.toml --features mini --test uninstall
          if ($LASTEXITCODE -ne 0) { throw 'Mini updater uninstall and installer bootstrap tests failed.' }
          & scripts/test-clip-shot-ocr-release-runtime.ps1
          & scripts/test-clip-shot-release-symbols.ps1 -Architecture $env:CLIP_ARCHITECTURE -ReleaseHelperPath build/${{ matrix.preset }}/clip_shot/Release/clip-shot-updater.exe
          & scripts/test-clip-shot-release-symbols.ps1 -Architecture $env:CLIP_ARCHITECTURE -Edition Mini -ReleaseHelperPath build/${{ matrix.preset }}/clip_shot_mini/Release/clip-shot-mini-updater.exe
          & scripts/test-clip-shot-installer.ps1 -Architecture $env:CLIP_ARCHITECTURE
          & scripts/test-clip-shot-installer-upgrade.ps1 -Architecture $env:CLIP_ARCHITECTURE -HelperPath build/${{ matrix.preset }}/clip_shot/Release/clip-shot-updater.exe
          & scripts/test-clip-shot-installer-upgrade.ps1 -Architecture $env:CLIP_ARCHITECTURE -Edition Mini -HelperPath build/${{ matrix.preset }}/clip_shot_mini/Release/clip-shot-mini-updater.exe
          & scripts/test-clip-shot-installer-i18n.ps1
          & scripts/test-clip-shot-installer-i18n.ps1 -Edition Mini
          & scripts/test-clip-shot-mini-release.ps1
          cmake --preset $env:CLIP_PRESET -DCLIP_SHOT_BUILD_UPDATE_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw "Updater test configuration failed." }
          cmake --build --preset "build-$env:CLIP_PRESET" --target clip-shot-update-adapter-tests clip-shot-update-about-tests clip-shot-update-settings-tests --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Updater test build failed." }
          ctest --test-dir build/${{ matrix.preset }}/clip_shot -C Release -R '^clip-shot-(update-(adapter-tests|about-tests|settings-tests))$' --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw "Updater tests failed." }
          & scripts/test-clip-shot-update-helper.ps1 -Architecture $env:CLIP_ARCHITECTURE -HelperPath build/${{ matrix.preset }}/clip_shot/Release/clip-shot-updater.exe

      - name: Validate final package payloads on the matching native host
        shell: pwsh
        run: |
          ./scripts/test-clip-shot-native-package.ps1 -Architecture $env:CLIP_ARCHITECTURE `
            -BuildDirectory build/${{ matrix.preset }}

      - name: Verify focused native architecture functionality
        shell: pwsh
        run: |
          . ./scripts/clip-build-environment.ps1
          $null = Set-ClipBuildEnvironment -Preset $env:CLIP_PRESET
          cmake --preset $env:CLIP_PRESET -DCLIP_APPS_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Native functional test configuration failed.' }
          cmake --build --preset "build-$env:CLIP_PRESET" --parallel 4 --target `
            clip-shot-clipboard-content-tests clip-shot-direct-capture-native-tests `
            clip-shot-capture-worker-tests clip-shot-screen-recording-controller-tests `
            clip-shot-diagnostics-crash-tests clip-shot-ocr-recognition-service-tests clip-shot-ocr-assets-tests
          if ($LASTEXITCODE -ne 0) { throw 'Native functional test build failed.' }
          ctest --test-dir build/${{ matrix.preset }}/clip_shot -C Release --output-on-failure --no-tests=error `
            -R '^clip-shot-(clipboard-content|direct-capture-native|capture-worker|screen-recording-controller|diagnostics-crash|ocr-(cpu-recognition-service|directml-recognition-service|crash|assets))-tests$'
          if ($LASTEXITCODE -ne 0) { throw 'Native architecture functional tests failed.' }

      - name: Verify tag and locate package
        id: package
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content -Raw CMakeLists.txt), 'set\(CLIP_SHOT_VERSION "([^"]+)"\)').Groups[1].Value
          if ($env:GITHUB_REF_NAME -cne "v${version}_clip-shot") {
            throw "Unexpected release tag: $env:GITHUB_REF_NAME"
          }
          $names = @()
          $base = "clip-shot-$version-windows-${{ matrix.architecture }}-offline"
          $names += @("$base.exe", "$base.exe.sha256", "$base.manifest.json")
          $base = "clip-shot-$version-windows-${{ matrix.architecture }}-portable"
          $names += @("$base.zip", "$base.zip.sha256", "$base.manifest.json")
          $descriptor = 'clip_shot/packaging/clip-shot-ocr-asset-manifest.json'
          $runtime = (Get-Content -Raw $descriptor | ConvertFrom-Json).runtime.version
          $base = "clip-ocr-runtime-$runtime-windows-$env:CLIP_ARCHITECTURE"
          $names += @("$base.zip", "$base.zip.sha256", "$base.manifest.json")
          $packages = @($names | ForEach-Object { Get-Item -LiteralPath "build/${{ matrix.preset }}/$_" -ErrorAction Stop })
          $packages += @(Get-ChildItem build/${{ matrix.preset }}/native-validation -Filter '*.native-validation.json' -File)
          $requiredProofBases = @("clip-shot-$version-windows-${{ matrix.architecture }}-offline.exe.native-validation.json", "clip-shot-$version-windows-${{ matrix.architecture }}-portable.zip.native-validation.json")
          $proofNames = @($packages | Where-Object Name -like '*.native-validation.json' | ForEach-Object { $_.Name })
          foreach ($required in $requiredProofBases) {
            if ($required -notin $proofNames) { throw "Missing native validation evidence: $required" }
          }
          $assets = ($packages | ForEach-Object { $_.FullName }) -join "`n"
          "assets<<CLIP_ASSETS" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $assets | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "CLIP_ASSETS" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Preserve final packages and native validation manifests
        uses: actions/upload-artifact@v4
        with:
          name: clip-shot-packages-${{ matrix.architecture }}
          path: ${{ steps.package.outputs.assets }}
          if-no-files-found: error
